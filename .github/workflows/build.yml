name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform scaffold and overlay app/
        run: |
          flutter create --platforms=android --org ru.echoes --project-name echoes build_tmp
          rm -rf build_tmp/test build_tmp/analysis_options.yaml
          cp -r app/. build_tmp/
      - name: Build
        working-directory: build_tmp
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: echoes-apk
          path: build_tmp/build/app/outputs/flutter-apk/app-release.apk
